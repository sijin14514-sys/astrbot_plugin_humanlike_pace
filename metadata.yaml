name: humanlike_pace
display_name: 真人节奏
short_desc: 已读不回与打字延迟
desc: >-
  让 Bot 不再秒回、不再逢消息必答。收到纯图片消息（表情包）时按概率直接不回复；
  回复发送前按正文长度计算随机停顿。两项行为各自可开关。
help: |-
  全部配置都在插件设置页，改完重载插件生效。

  【已读不回】只对「纯图片」消息生效——图片配文字的照常回复。
  概率设 0 等于关闭，设 100 等于永远不理。冷却时间防止连续多次不回复。

  【打字延迟】停顿 = 基础停顿 + 正文字数 × 每字停顿 + 随机抖动，再按上限截断。
version: 1.0.0
author: sijin14514-sys
repo: https://github.com/sijin14514-sys/astrbot_plugin_humanlike_pace
astrbot_version: ">=4.24.0"
tags:
  - 拟人
  - 已读不回
  - 打字延迟
  - 回复控制
